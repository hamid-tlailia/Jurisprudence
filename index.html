<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta name="description" content="رواق: منصة لتعليم الفقه الإسلامي وأصوله، والحديث النبوي وعلومه، مع متون مشروحة وخطط يومية ومُعين ذكي." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="رواق" />
    <meta name="apple-mobile-web-app-title" content="رواق" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>رواق</title>
    <script>
      // تطبيق المظهر المحفوظ قبل الرسم لتفادي الوميض
      try {
        var s = JSON.parse(localStorage.getItem("riwaq-v1") || "{}").state;
        var t = s && s.settings && s.settings.theme;
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (s && s.settings && s.settings.fontScale) document.documentElement.style.setProperty("--fs", s.settings.fontScale);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
